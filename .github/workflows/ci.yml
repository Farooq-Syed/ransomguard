name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest tests -q

      - name: ML training smoke test
        run: python train_v2.py --n-benign 8 --n-ransom 8 --n-files 15 --n-windows 4 --out models/v2_smoke.pkl

      - name: v1 evaluation smoke test
        run: python run_v1_test.py --n-benign 4 --n-ransom 4 --n-files 15 --n-windows 4

      - name: v2 evaluation smoke test
        run: python run_v2_test.py --model models/v2_smoke.pkl --n-benign 4 --n-ransom 4 --n-files 15 --n-windows 4
